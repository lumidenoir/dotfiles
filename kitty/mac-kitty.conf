# =============================================================================
# mac-kitty.conf — macOS-Inspired Minimalist Dark Terminal
# =============================================================================

# -----------------------------------------------------------------------------
# Font
# -----------------------------------------------------------------------------
font_family      GeistMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------
# thin beam cursor — matches macOS feel
cursor_shape           beam
# no blinking — calmer, less distracting
cursor_blink_interval  0
# text under cursor matches bg for clarity
cursor_text_color      background

# -----------------------------------------------------------------------------
# Scrollback
# -----------------------------------------------------------------------------
scrollback_lines  5000

# -----------------------------------------------------------------------------
# Performance
# -----------------------------------------------------------------------------
repaint_delay  10
# sync frame output to monitor refresh rate
sync_to_monitor yes
# latency between input and screen update (ms)
input_delay     3

# -----------------------------------------------------------------------------
# Bell
# -----------------------------------------------------------------------------
# never beep
enable_audio_bell   no
# no flash either
visual_bell_duration 0.0

# -----------------------------------------------------------------------------
# Mouse & URLs
# -----------------------------------------------------------------------------
# hide cursor after 3s inactivity inside terminal
mouse_hide_wait  3.0
# auto-detect URLs in terminal output
detect_urls      yes
# curly underline on URLs — more elegant than straight
url_style        curly
# use xdg-open / system default browser
open_url_with    default

# -----------------------------------------------------------------------------
# Selection
# -----------------------------------------------------------------------------
# auto-copy to clipboard on any selection
copy_on_select         yes
# strip trailing whitespace only on copy
strip_trailing_spaces  smart

# -----------------------------------------------------------------------------
# Window Layout
# -----------------------------------------------------------------------------
window_padding_width    12
# no title bar
hide_window_decorations yes
# don't ask to confirm on close
confirm_os_window_close 0

# -----------------------------------------------------------------------------
# Transparency & Blur
# -----------------------------------------------------------------------------
background_opacity  0.82
background_blur     1

# =============================================================================
# Color Palette — Frosted macOS Developer (Muted High-Contrast)
# =============================================================================

background  #0c0c0d
foreground  #e5e5eb
cursor      #ffffff

# Selection — soft Apple blue tint, matches Spotlight theme
selection_background  #1c4f8a
selection_foreground  #ffffff

# URL highlight color — matches the Apple blue in color4
url_color  #59b2f3

# Blacks
color0  #242426
color8  #48484a

# Red — Soft Coral (readable on dark bg, not harsh)
color1  #e26a7a
color9  #f28b99

# Green — Muted Mint/Sage (not neon — very mature choice)
color2   #84c98f
color10  #9ce6a7

# Yellow — Warm Golden Amber (cohesive with Apple's warm yellows)
color3   #e0b869
color11  #f2d18a

# Blue — Soft Classic Apple Blue ✓ best color in the palette
color4   #59b2f3
color12  #7acaff

# Magenta — Soft Lavender/Grape (not garish, sits well with the blues)
color5   #bf96e3
color13  #dbbeeb

# Cyan — Softer Teal (slightly desaturated — pairs well with the greens)
color6   #63c5d6
color14  #87e0eb

# Whites
color7   #b5b5bc
color15  #ffffff
