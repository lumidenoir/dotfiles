# --- MangoWM Config (config.conf) ---
# Ported from Hyprland configuration

# Monitors
# MangoWM automatically detects monitors. 
# monitorrule=option:value,criteria:pattern
# output eDP-1 mode 1920x1080@60 position 0,0

# Autostart
exec-once=awww-daemon & sleep 0.1 && awww restore
exec-once=waybar -c ~/.config/waybar/mango/config.json -s ~/.config/waybar/mango/style.css
exec-once=dunst
exec-once=auto_network_switch.sh & mpd & mpDris2 & battery_notifier.sh &
exec-once=pidof -q polkit-gnome-authentication-agent-1 || { /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 & }
exec-once=clipse -listen
exec-once=kdeconnectd

# Inputs
xkb_rules_layout=us
sloppyfocus=1
trackpad_natural_scrolling=1
mouse_natural_scrolling=1

# General Layout & Styling
gappih=4
gappiv=4
gappoh=8
gappov=8
borderpx=2
border_radius=10

# Tag Rules (Set layout to scroller for all tags)
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# Visual Effects
blur=1
blur_params_radius=6
blur_params_num_passes=2
shadows=1
shadows_size=4

# Animations
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
animation_duration_move=300
animation_duration_open=300
animation_duration_close=500

# Layer Rules for Animations
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
layerrule=animation_type_open:slide,layer_name:notifications
layerrule=animation_type_close:slide,layer_name:notifications

# Window Rules
windowrule=isfloating:1,appid:^clipse$
windowrule=isfloating:1,title:^(Open File|Open Folder|Open|Save|Save As|Export|Import|Choose File|Rename|script-fu|kdenlive|brave)$

# Keybindings
bind=SUPER,Return,spawn,kitty
bind=ALT,q,killclient,
bind=SUPER,p,spawn,powermenu.sh
bind=SUPER,l,spawn,screenlock.sh
bind=SUPER+SHIFT,f,togglefloating,
bind=SUPER,space,spawn,rofi -show drun -theme ~/.config/rofi/hypr.rasi
bind=SUPER,f,spawn,nemo
bind=SUPER,b,spawn,firefox
bind=SUPER,v,spawn,kitty --class clipse -e 'clipse'
bind=SUPER,s,spawn,spotlight.sh
bind=SUPER,a,spawn,~/dotfiles/scripts/keybindings.py
bind=SUPER+SHIFT,r,reload_config,

# Navigation
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,Tab,switch_layout,next
bind=SUPER+SHIFT,Tab,switch_layout,prev

# Workspaces (Tags)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Media Keys
bind=none,XF86MonBrightnessDown,spawn,settings_control.sh brightness_down
bind=none,XF86MonBrightnessUp,spawn,settings_control.sh brightness_up
bind=none,XF86AudioRaiseVolume,spawn,settings_control.sh volume_up
bind=none,XF86AudioLowerVolume,spawn,settings_control.sh volume_down
bind=none,XF86AudioMute,spawn,settings_control.sh volume_mute
bind=none,XF86AudioPlay,spawn,settings_control.sh play_pause
bind=none,XF86AudioPrev,spawn,settings_control.sh play_prev
bind=none,XF86AudioNext,spawn,settings_control.sh play_next

# Screenshots
bind=SUPER,Print,spawn,screenshot.sh --sel
bind=none,Print,spawn,screenshot.sh
bind=SUPER+CTRL,Print,spawn,screenshot.sh --stop

# Theming (Imported colors)
source-optional=~/.config/mango/colors.conf

