# MPD Network & Directory Settings
bind_to_address     "127.0.0.1"
port                "6600"

music_directory     "~/Music"
playlist_directory  "~/.mpd/playlists"
db_file             "~/.mpd/mpd.db"
log_file            "~/.mpd/log"
pid_file            "~/.mpd/pid"
state_file          "~/.mpd/state"

# -------------------------------------------------------------------
# Primary Output: PipeWire Sound Server
# -------------------------------------------------------------------
audio_output {
   type            "pipewire"
   name            "PipeWire Sound Server"
}

# -------------------------------------------------------------------
# Bit-Perfect Hardware Output: FiiO RETRO NANO
# -------------------------------------------------------------------
audio_output {
   type            "alsa"
   name            "FiiO RETRO NANO (Bit-Perfect)"
   device          "hw:CARD=NANO,DEV=0"
   mixer_type      "none"
   auto_resample   "no"
   auto_format     "no"
   auto_channels   "no"
}

# -------------------------------------------------------------------
# Optional: Terminal Visualizer Stream (ncmpcpp)
# Note: Uncomment only if you use a spectrum visualizer in ncmpcpp
# -------------------------------------------------------------------
audio_output {
   type            "fifo"
   name            "Visualizer FIFO"
   path            "/tmp/mpd.fifo"
   format          "44100:16:2"
}
