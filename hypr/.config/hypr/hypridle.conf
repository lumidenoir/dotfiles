general {
    lock_cmd = ~/dotfiles/scripts/screenlock.sh       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before sleep.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# Backlight dim removed - desktop monitor has no kernel backlight control
# listener {
#     timeout = 150
#     on-timeout = brightnessctl -s set 10
#     on-resume = brightnessctl -r
# }

listener {
    timeout = 600                                # 10min - longer idle on desktop before locking
    on-timeout = loginctl lock-session           # lock screen
}

listener {
    timeout = 660                                # 11min - screen off shortly after lock
    on-timeout = hyprctl dispatch dpms off       # screen off
    on-resume = hyprctl dispatch dpms on         # screen on
}

