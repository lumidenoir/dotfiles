# Hyprlock Configuration
# Apple Mac/Glassmorphism style

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = /home/lumi/Pictures/wallpaper/other/lockscreen.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Clock (Hours & Minutes)
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95) # Clean White Foreground
    font_size = 96
    font_family = Geist, sans-serif
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:3600000] echo "$(date +'%A, %d %B')"
    color = rgba(255, 255, 255, 0.65) # Muted White Foreground
    font_size = 22
    font_family = Geist, sans-serif
    position = 0, 100
    halign = center
    valign = center
}

# Locked text / Greeting
label {
    monitor =
    text = Hi, $USER
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    font_family = Geist, sans-serif
    position = 0, -40
    halign = center
    valign = center
}

# Input Field
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.08)
    inner_color = rgba(28, 28, 30, 0.65) # Glassmorphic macOS dark input field
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    fail_color = rgb(255, 69, 58) # Apple Red
    check_color = rgb(0, 122, 255) # Apple Blue
    position = 0, -100
    halign = center
    valign = center
}

# Battery status icon/text at the bottom
label {
    monitor =
    text = cmd[update:5000] bash -c 'IFS="|" read -r cap online time_str <<< "$(~/dotfiles/scripts/battery_status.sh)"; if [ "$online" -eq 1 ]; then if [ "$cap" -eq 100 ]; then echo "󰂄 Full"; else echo "󱐋 $cap% ($time_str)"; fi; else if [ "$cap" -ge 90 ]; then icon="󰁹"; elif [ "$cap" -ge 80 ]; then icon="󰂂"; elif [ "$cap" -ge 70 ]; then icon="󰂁"; elif [ "$cap" -ge 60 ]; then icon="󰂀"; elif [ "$cap" -ge 50 ]; then icon="󰁿"; elif [ "$cap" -ge 40 ]; then icon="󰁾"; elif [ "$cap" -ge 30 ]; then icon="󰁽"; elif [ "$cap" -ge 20 ]; then icon="󰁼"; else icon="󰁻"; fi; echo "$icon $cap% ($time_str)"; fi'
    color = rgba(255, 255, 255, 0.5)
    font_size = 11
    font_family = Geist, sans-serif
    position = 0, 40
    halign = center
    valign = bottom
}

# Song status label at the bottom (macOS style)
label {
    monitor =
    text = cmd[update:1000] bash -c 'status=$(playerctl status 2>/dev/null); if [ "$status" = "Playing" ] || [ "$status" = "Paused" ]; then echo -e "󰎆  $(playerctl metadata title) - $(playerctl metadata artist)"; else echo ""; fi'
    color = rgba(255, 255, 255, 0.6)
    font_size = 13
    font_family = Geist, sans-serif
    position = 0, 70
    halign = center
    valign = bottom
}
