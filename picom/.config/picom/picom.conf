#################################
#             Shadows           #
#################################

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.40;          # Softened opacity for a cleaner, modern layered depth look
shadow-offset-x = -8;          # Centered symmetrically based on the radius
shadow-offset-y = -8;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g *= 'slop'",
  "class_g = 'Firefox' && argb",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_WINDOW_TYPE@:a *= '_NET_WM_WINDOW_TYPE_DROPDOWN_MENU'",
  "_NET_WM_WINDOW_TYPE@:a *= '_NET_WM_WINDOW_TYPE_POPUP_MENU'"
];

#################################
#            Fading             #
#################################

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;

no-fading-openclose = false;
no-fading-destroyed-argb = false;

#################################
#   Transparency / Opacity      #
#################################

inactive-opacity = 1.0;
frame-opacity = 1.0;
active-opacity = 1.0;
inactive-dim = 0.2;

focus-exclude = [
  "class_g ?= 'slop'",
  "name = 'rofi'",
  "class_g ?= 'Steam'",
  "window_type = 'dock'",
  "_NET_WM_WINDOW_TYPE *= 'MENU'",
  "window_type *= 'menu'",
  "window_type = 'utility'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "class_g *= 'Dunst'"
];

opacity-rule = [
  "100:class_g = 'firefox' && argb",
  "100:class_g *= 'Rofi'",
  "100:QTILE_INTERNAL = 1"
];

#################################
#            Corners            #
#################################

corner-radius = 0;

# Let popups have rounded corners too! Only exclude things that absolutely break.
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "class_g *= 'dwm'",
  "class_g *= 'awesome'",
  # Disables Picom corner calculation on menus so GTK can handle its own anti-aliasing natively
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'menu'"
];

#################################
#      Background-Blurring      #
#################################

blur: {
  method = "dual_kawase";
  strength = 6;
  background = false;
  background-frame = true;
  background-fixed = true;
}

blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'slop'",
  "class_g = 'Firefox' && argb",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#       General Settings        #
#################################

backend = "glx";
dithered-present = false;
vsync = true;

mark-wmwin-focused = true;
mark-ovredir-focused = false;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";
log-file = "/home/lumi/picom.log"; # Ensure this matches your active username path

#################################
#     Window Type Settings      #
#################################

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; blur-background = true; };
  popup_menu = { fade = true; shadow = true; opacity = 0.98; blur-background = true; };
  dropdown_menu = { fade = true; shadow = true; opacity = 0.98; blur-background = true; };
  menu = { fade = true; shadow = true; };
  utility = { shadow = true; };
  toolbar = { shadow = true; };
  dialog = { shadow = true; };
  normal = { full-shadow = true; };
  notification = { fade = true; shadow = true; full-shadow = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
};

#################################
#       Animation Settings      #
#################################

animations = (
  {
    triggers = ["open"];
    opacity = {
      curve = "cubic-bezier(0.16, 1, 0.3, 1)";
      duration = 0.18;
      start = 0;
      end = "window-raw-opacity";
    }
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.16, 1, 0.3, 1)";
      duration = 0.18;
      start = 0.97;
      end = 1;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["close"];
    opacity = {
      curve = "cubic-bezier(0.4, 0, 1, 1)";
      duration = 0.14;
      start = "window-raw-opacity-before";
      end = 0;
    };
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.4, 0, 1, 1)";
      duration = 0.14;
      start = 1;
      end = 0.97;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["geometry"];
    scale-x = {
      curve = "cubic-bezier(0.2, 0.8, 0.2, 1)";
      duration = 0.15;
      start = "window-width-before / window-width";
      end = 1;
    };
    scale-y = {
      curve = "cubic-bezier(0.2, 0.8, 0.2, 1)";
      duration = 0.15;
      start = "window-height-before / window-height";
      end = 1;
    };
    offset-x = {
      curve = "cubic-bezier(0.2, 0.8, 0.2, 1)";
      duration = 0.15;
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0.2, 0.8, 0.2, 1)";
      duration = 0.15;
      start = "window-y-before - window-y";
      end = 0;
    };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
)
